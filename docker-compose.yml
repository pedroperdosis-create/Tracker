services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build: .
    command: ["npm", "run", "prisma:migrate"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    command: ["node", "apps/bot/dist/index.js"]
    env_file:
      - .env
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  watcher:
    build: .
    command: ["node", "apps/watcher/dist/index.js"]
    env_file:
      - .env
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      TONAPI_KEY: ${TONAPI_KEY}
      TONAPI_BASE: ${TONAPI_BASE}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS}
      WEBHOOK_PORT: ${WEBHOOK_PORT:-8080}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
